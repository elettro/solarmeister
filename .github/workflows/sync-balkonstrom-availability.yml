name: Sync Balkonstrom Availability + Price

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Run at both possible UTC equivalents, then gate on Europe/Berlin.
    - cron: '1 6 * * *'
    - cron: '1 7 * * *'

permissions:
  contents: read

jobs:
  sync-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Berlin schedule
        id: berlin_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Berlin date +%H%M)" = "0801" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC trigger. It is not 08:01 in Berlin."
          fi

      - name: Check out repository
        if: steps.berlin_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.berlin_gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get fresh Shopify Admin API token
        if: steps.berlin_gate.outputs.should_run == 'true'
        shell: bash
        env:
          SHOPIFY_STORE_DOMAIN: f3yf3y-qu.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$SHOPIFY_CLIENT_ID" ] || [ -z "$SHOPIFY_CLIENT_SECRET" ]; then
            echo "Missing SHOPIFY_CLIENT_ID or SHOPIFY_CLIENT_SECRET repository secret."
            exit 2
          fi

          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST "https://${SHOPIFY_STORE_DOMAIN}/admin/oauth/access_token" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n \
              --arg grant_type 'client_credentials' \
              --arg client_id "$SHOPIFY_CLIENT_ID" \
              --arg client_secret "$SHOPIFY_CLIENT_SECRET" \
              '{grant_type:$grant_type,client_id:$client_id,client_secret:$client_secret}')")"

          TOKEN="$(printf '%s' "$RESPONSE" | jq -r '.access_token // empty')"
          if [ -z "$TOKEN" ]; then
            echo "Shopify did not return an Admin API access token. Check the app installation, scopes, and credentials."
            exit 2
          fi

          echo "::add-mask::$TOKEN"
          echo "SHOPIFY_ADMIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Fresh Shopify Admin API token acquired for this run."

      - name: Sync supplier availability and audit price parity
        id: sync
        if: steps.berlin_gate.outputs.should_run == 'true'
        env:
          SHOPIFY_STORE_DOMAIN: f3yf3y-qu.myshopify.com
          SHOPIFY_API_VERSION: '2026-07'
          PRICE_DRY_RUN: '1'
          PRICE_MARKUP: '0.17'
          MAX_PRICE_CHANGE_RATIO: '0.50'
          SYNC_REPORT_PATH: sync-report.json
        run: node scripts/sync-balkonstrom-availability.mjs

      - name: Email SolarMeister sync report
        if: always() && steps.berlin_gate.outputs.should_run == 'true'
        env:
          SYNC_REPORT_PATH: sync-report.json
          SYNC_REPORT_TO: dpalermo@elettro.com,fs@neckermann-strom.de
          PRICE_DRY_RUN: '1'
          PRICE_MARKUP: '0.17'
          MAX_PRICE_CHANGE_RATIO: '0.50'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNC_STEP_OUTCOME: ${{ steps.sync.outcome }}
        run: python3 scripts/send-sync-report.py
