name: Import official SolarMeister logos

on:
  push:
    paths:
      - '.github/workflows/import-official-brand-logos.yml'

permissions:
  contents: write

jobs:
  import-logos:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive V1 logos
        run: |
          set -euo pipefail
          mkdir -p assets/branding/logos/archive/v1
          for f in logos/solarmeister-horizontal-dark.png logos/solarmeister-horizontal-light.png logos/solarmeister-square-dark.png logos/solarmeister-square-light.png logos/solarmeister-vertical-dark.png logos/solarmeister-vertical-light.png; do
            if [ -f "$f" ]; then cp "$f" assets/branding/logos/archive/v1/; fi
          done

      - name: Create official logo folders
        run: |
          mkdir -p assets/branding/logos/current/solar-meister/print/black
          mkdir -p assets/branding/logos/current/solar-meister/print/white
          mkdir -p assets/branding/logos/current/solar-meister/web/black
          mkdir -p assets/branding/logos/current/solar-meister/web/white
          mkdir -p assets/branding/logos/current/solar-meister-neckermann/print/black
          mkdir -p assets/branding/logos/current/solar-meister-neckermann/print/white
          mkdir -p assets/branding/logos/current/solar-meister-neckermann/web/black
          mkdir -p assets/branding/logos/current/solar-meister-neckermann/web/white
          mkdir -p assets/branding/logos/current/solar-meister-neckermann-shop/print/black
          mkdir -p assets/branding/logos/current/solar-meister-neckermann-shop/print/white
          mkdir -p assets/branding/logos/current/solar-meister-neckermann-shop/web/black
          mkdir -p assets/branding/logos/current/solar-meister-neckermann-shop/web/white
          mkdir -p assets/branding/logos/current/reference

      - name: Download official logo assets
        run: |
          set -euo pipefail
          curl -fL 'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/solar-meister-black-print.png?v=1788971290' -o assets/branding/logos/current/solar-meister/print/black/solar-meister-black-print.png
          curl -fL 'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/solar-meister-white-print.png?v=1788971408' -o assets/branding/logos/current/solar-meister/print/white/solar-meister-white-print.png
          curl -fL 'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/solar-meister-black-web.png?v=1788971458' -o assets/branding/logos/current/solar-meister/web/black/solar-meister-black-web.png
          curl -fL 'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/solar-meister-white-web.png?v=1788971465' -o assets/branding/logos/current/solar-meister/web/white/solar-meister-white-web.png
          curl -fL 'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/solar-meister-neckermann-black-print.png?v=1788971419' -o assets/branding/logos/current/solar-meister-neckermann/print/black/solar-meister-neckermann-black-print.png
          curl -fL 'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/solar-meister-neckermann-white-print.png?v=1788971431' -o assets/branding/logos/current/solar-meister-neckermann/print/white/solar-meister-neckermann-white-print.png
          curl -fL 'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/solar-meister-neckermann-black-web.png?v=1788971478' -o assets/branding/logos/current/solar-meister-neckermann/web/black/solar-meister-neckermann-black-web.png
          curl -fL 'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/solar-meister-neckermann-white-web.png?v=1788971487' -o assets/branding/logos/current/solar-meister-neckermann/web/white/solar-meister-neckermann-white-web.png
          curl -fL 'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/solar-meister-neckermann-shop-black-print.png?v=1788971438' -o assets/branding/logos/current/solar-meister-neckermann-shop/print/black/solar-meister-neckermann-shop-black-print.png
          curl -fL 'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/solar-meister-neckermann-shop-white-print.png?v=1788971448' -o assets/branding/logos/current/solar-meister-neckermann-shop/print/white/solar-meister-neckermann-shop-white-print.png
          curl -fL 'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/solar-meister-neckermann-shop-black-web.png?v=1788971497' -o assets/branding/logos/current/solar-meister-neckermann-shop/web/black/solar-meister-neckermann-shop-black-web.png
          curl -fL 'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/solar-meister-neckermann-shop-white-web.png?v=1788971506' -o assets/branding/logos/current/solar-meister-neckermann-shop/web/white/solar-meister-neckermann-shop-white-web.png
          curl -fL 'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/solar-meister-signature-mark-3-lines-reference.png?v=1788971516' -o assets/branding/logos/current/reference/solar-meister-signature-mark-3-lines-reference.png

      - name: Remove V1 files from active logo folder
        run: |
          rm -f logos/solarmeister-horizontal-dark.png logos/solarmeister-horizontal-light.png logos/solarmeister-square-dark.png logos/solarmeister-square-light.png logos/solarmeister-vertical-dark.png logos/solarmeister-vertical-light.png

      - name: Commit imported assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/branding/logos logos
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Organize official SolarMeister logo assets and archive V1'
          git pull --rebase origin main
          git push origin HEAD:main
