name: Sync SolarMeister Brand Navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-brand-nav-tshirts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add shared links to every SolarMeister brand navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []

          def anchor_pattern(label):
              return re.compile(
                  rf'<a\s+[^>]*>\s*{re.escape(label)}\s*</a>',
                  re.I,
              )

          def has_link(text, label):
              return anchor_pattern(label).search(text) is not None

          def dedupe_link(text, label):
              pattern = anchor_pattern(label)
              matches = list(pattern.finditer(text))
              if len(matches) <= 1:
                  return text, False

              keep_index = next(
                  (index for index, match in enumerate(matches) if 'aria-current' in match.group(0).lower()),
                  0,
              )
              keep_start = matches[keep_index].start()
              seen_kept = False

              def replace(match):
                  nonlocal seen_kept
                  if match.start() == keep_start and not seen_kept:
                      seen_kept = True
                      return match.group(0)
                  return ''

              return pattern.sub(replace, text), True

          def insert_after(text, anchors, link):
              for slug, label in anchors:
                  pattern = re.compile(
                      rf'(<a\s+[^>]*href=["\'][^"\']*{slug}/?(?:index\.html)?["\'][^>]*>\s*{re.escape(label)}\s*</a>)',
                      re.I,
                  )
                  updated, count = pattern.subn(r'\1\n        ' + link, text, count=1)
                  if count:
                      return updated, True
              return text, False

          for path in sorted(Path('.').rglob('index.html')):
              text = path.read_text(encoding='utf-8')

              # Only update pages that already use the SolarMeister global brand header.
              if 'SolarMeister Brand Home' not in text and 'global brand navigation' not in text:
                  continue

              depth = len(path.parent.parts)
              prefix = '' if depth == 0 else '../' * depth
              updated = text
              page_changed = False

              for label in ('T-Shirts', 'MeisterNetz'):
                  updated, deduped = dedupe_link(updated, label)
                  page_changed = page_changed or deduped

              if not has_link(updated, 'T-Shirts'):
                  link = f'<a href="{prefix}tshirts/">T-Shirts</a>'
                  updated, inserted = insert_after(
                      updated,
                      [('infographics', 'Infographics'), ('onesheets', 'One Sheets')],
                      link,
                  )
                  page_changed = page_changed or inserted

              if not has_link(updated, 'MeisterNetz'):
                  link = f'<a href="{prefix}meisternetz/">MeisterNetz</a>'
                  updated, inserted = insert_after(
                      updated,
                      [('tshirts', 'T-Shirts'), ('infographics', 'Infographics'), ('onesheets', 'One Sheets')],
                      link,
                  )
                  page_changed = page_changed or inserted

              if page_changed and updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated navigation in:')
          for item in changed:
              print(f' - {item}')

      - name: Commit synchronized navigation
        run: |
          if git diff --quiet; then
            echo "No navigation updates were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/index.html' index.html
          git commit -m "Normalize MeisterNetz links in SolarMeister global navigation"
          git push
